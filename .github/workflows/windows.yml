name: Windows build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.1'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Legacy self-test entry point
        run: ./run_selftest.ps1 -BuildDir build -Executable build/Release/synera.exe -ReportPath build/legacy_report.txt
